<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数据查看 - Clothing-SI 管理后台</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin/users">Clothing-SI 管理后台</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/admin/users">用户管理</a>
            <a class="nav-link active" href="/admin/data">数据查看</a>
            <a class="nav-link" href="/admin/config">系统配置</a>
            <a class="nav-link text-danger" href="/admin/logout">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header">商品数量排行</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>排名</th>
                    <th>用户名</th>
                    <th>店铺/昵称</th>
                    <th>角色</th>
                    <th>商品数</th>
                    <th>状态</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r, iter : ${rankings}">
                    <td th:text="${iter.index + 1}"></td>
                    <td th:text="${r.username}"></td>
                    <td th:text="${r.displayName}"></td>
                    <td>
                        <span th:if="${r.role == 1}" class="badge bg-info">零售商</span>
                        <span th:if="${r.role == 2}" class="badge bg-warning text-dark">批发商</span>
                        <span th:if="${r.role == 3}" class="badge bg-success">买家</span>
                    </td>
                    <td th:text="${r.productCount}"></td>
                    <td>
                        <span th:if="${r.status == 1}" class="text-success">正常</span>
                        <span th:if="${r.status == 0}" class="text-danger">禁用</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="text-muted small mt-2">* 不显示任何金额数据</p>
</div>
</body>
</html>
