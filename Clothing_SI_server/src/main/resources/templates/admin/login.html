<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clothing-SI 管理后台 - 登录</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; display: flex; align-items: center; min-height: 100vh; }
        .login-box { max-width: 400px; margin: 0 auto; }
    </style>
</head>
<body>
<div class="container">
    <div class="login-box">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Clothing-SI 管理后台</h3>
                <p class="text-center text-muted small mb-4">--- HeBen_Cat ---</p>

                <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

                <form method="post" action="/admin/login">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登录</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
