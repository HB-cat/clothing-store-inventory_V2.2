<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>系统配置 - Clothing-SI 管理后台</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        function doCleanup(url, msg) {
            if (!confirm(msg)) return;
            $.post(url, function (res) {
                if (res.code === 200) {
                    alert(res.data || res.message);
                } else {
                    alert('操作失败：' + res.message);
                }
            });
        }
    </script>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin/users">Clothing-SI 管理后台</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/admin/users">用户管理</a>
            <a class="nav-link" href="/admin/data">数据查看</a>
            <a class="nav-link active" href="/admin/config">系统配置</a>
            <a class="nav-link text-danger" href="/admin/logout">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card mb-4">
        <div class="card-header">服务器信息</div>
        <div class="card-body">
            <table class="table mb-0" style="max-width: 400px;">
                <tr><td>服务器端口</td><td>8080</td></tr>
                <tr><td>数据库</td><td>clothing_si_db</td></tr>
                <tr><td>框架版本</td><td>Spring Boot 3.2.0</td></tr>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header">数据操作</div>
        <div class="card-body">
            <p class="text-muted small">以下操作均有二次确认，请谨慎操作</p>
            <button class="btn btn-outline-warning me-2"
                    onclick="doCleanup('/admin/config/cleanup-appointments', '确定清理30天前的已取消预约？')">
                清理过期预约数据
            </button>
            <button class="btn btn-outline-danger"
                    onclick="doCleanup('/admin/config/cleanup-testdata', '确定删除所有非管理员用户及其数据？此操作不可撤销！')">
                清理测试数据
            </button>
        </div>
    </div>
</div>
</body>
</html>
