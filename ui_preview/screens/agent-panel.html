<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>智能体 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav" style="position:relative">
    <span class="back" onclick="location.href='home.html'">‹</span>
    <span class="title">AI 智能体</span>
    <span class="action" onclick="alert('设置')">⚙</span>
  </div>
  <div class="content" style="display:flex;flex-direction:column;justify-content:flex-end">
    <div class="chat-bubble"><div class="avatar">🤖</div><div class="bubble incoming">你好！我是智能助手，可以帮你查库存、记账或新建订单。试试对我说："卖了2件白T恤"</div></div>
    <div class="chat-bubble mine"><div class="avatar">👤</div><div class="bubble outgoing">昨天进了多少货</div></div>
    <div class="chat-bubble"><div class="avatar">🤖</div><div class="bubble incoming">📦 昨天共进货 2 批：<br>1. 纯棉圆领T恤 50件 ¥1,950<br>2. 高腰阔腿牛仔裤 30件 ¥2,100</div></div>
  </div>
  <div class="chat-input">
    <input placeholder="输入指令..." id="chatInput" onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">➤</button>
  </div>
</div></div>
<script>
  function sendChat() {
    var input = document.getElementById('chatInput');
    var msg = input.value.trim();
    if(!msg) return;
    var bubble = '<div class="chat-bubble mine"><div class="avatar">👤</div><div class="bubble outgoing">'+msg+'</div></div>';
    var reply = '<div class="chat-bubble"><div class="avatar">🤖</div><div class="bubble incoming">✅ 已收到指令，正在处理...</div></div>';
    var content = document.querySelector('.phone .content');
    content.insertAdjacentHTML('beforeend', bubble);
    content.insertAdjacentHTML('beforeend', reply);
    content.scrollTop = content.scrollHeight;
    input.value = '';
  }
</script>
</body></html>
