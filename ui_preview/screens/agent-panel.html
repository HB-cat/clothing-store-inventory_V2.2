<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>智能体 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone" style="height:500px;border-radius:20px;width:350px">
  <div class="top-nav" style="background:var(--primary);color:#fff;border-radius:20px 20px 0 0">
    <span class="title" style="color:#fff">🤖 智能体助手</span>
    <button class="action" style="color:#fff" onclick="history.back()">✕</button>
  </div>
  <div class="content" style="display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:8px">
    <div style="text-align:center;font-size:12px;color:var(--text-secondary);margin-bottom:8px">今日已使用 3 次 · DeepSeek 在线</div>
    <div class="chat-bubble">
      <div class="avatar" style="background:var(--primary-light)">🤖</div>
      <div class="bubble incoming" style="background:var(--primary-light)">你好！我可以帮你：<br>📝 快速记账 · 📊 查询销售<br>📦 补货提醒 · 🗂️ 管理商品<br>试试对我说「卖了红色连衣裙2件90元」</div>
    </div>
    <div class="chat-bubble mine">
      <div class="avatar">👤</div>
      <div class="bubble outgoing">本月销售额多少</div>
    </div>
    <div class="chat-bubble">
      <div class="avatar" style="background:var(--primary-light)">🤖</div>
      <div class="bubble incoming" style="background:var(--primary-light)">📊 本月销售额: ¥45,680<br>本月订单: 128 单<br>日均: ¥1,903</div>
    </div>
  </div>
  <div class="chat-input">
    <span style="cursor:default">🎤</span>
    <input placeholder="输入指令，Enter发送...">
    <button>➤</button>
  </div>
</div></div>
</body></html>
