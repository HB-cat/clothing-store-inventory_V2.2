<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>属性管理 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav" style="position:relative">
    <span class="back" onclick="location.href='profile.html'">‹</span>
    <span class="title">属性管理</span>
    <span class="action" onclick="alert('新增属性')">+</span>
  </div>
  <div class="content">
    <div class="segment" id="attrSegment">
      <button class="opt active" onclick="toggleSeg(this)">颜色</button>
      <button class="opt" onclick="toggleSeg(this)">尺码</button>
      <button class="opt" onclick="toggleSeg(this)">材质</button>
    </div>
    <div class="card" style="padding:0 16px">
      <div class="list-item"><div class="thumb" style="background:#fff;border:1px solid var(--border)">⬜</div><div class="info"><div class="name">白色</div></div></div>
      <div class="list-item"><div class="thumb" style="background:#000"></div><div class="info"><div class="name">黑色</div></div></div>
      <div class="list-item"><div class="thumb" style="background:#1565C0"></div><div class="info"><div class="name">蓝色</div></div></div>
      <div class="list-item"><div class="thumb" style="background:#E53935"></div><div class="info"><div class="name">红色</div></div></div>
      <div class="list-item" style="color:var(--primary);cursor:pointer;border-bottom:none"><div class="info"><div class="name">+ 添加颜色</div></div></div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="tab" onclick="location.href='home.html'"><span class="icon">🏠</span>首页</button>
    <button class="tab" onclick="location.href='bills.html'"><span class="icon">📋</span>账单</button>
    <button class="tab" onclick="location.href='products.html'"><span class="icon">🏷️</span>商品</button>
    <button class="tab" onclick="location.href='profile.html'"><span class="icon">👤</span>我的</button>
  </div>
  <button class="agent-fab" onclick="location.href='agent-panel.html'" title="智能体">AI</button>
</div></div>
<script>
  function toggleSeg(el) { el.parentElement.querySelectorAll('.opt').forEach(function(b){b.classList.remove('active')}); el.classList.add('active'); }
</script>
</body></html>
