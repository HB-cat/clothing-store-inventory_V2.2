<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>属性管理 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav">
    <button class="back" onclick="history.back()">←</button>
    <span class="title">属性管理</span>
    <button class="action">➕</button>
  </div>
  <div class="content">
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:10px">管理颜色、尺码等属性组，用于商品组合库存</p>

    <div class="card">
      <div class="section-header"><h3>🎨 颜色</h3><button class="btn btn-sm btn-outline">+ 添加</button></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">白色 ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">黑色 ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">红色 ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">蓝色 ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">黄色 ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">粉色 ✕</span>
      </div>
    </div>

    <div class="card">
      <div class="section-header"><h3>📏 尺码</h3><button class="btn btn-sm btn-outline">+ 添加</button></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">S ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">M ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">L ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">XL ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">XXL ✕</span>
      </div>
    </div>

    <div class="card">
      <div class="section-header"><h3>🧵 材质</h3><button class="btn btn-sm btn-outline">+ 添加</button></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">纯棉 ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">雪纺 ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">牛仔 ✕</span>
        <span class="tag" style="background:#F5F5F5;padding:6px 12px;font-size:13px">毛呢 ✕</span>
      </div>
    </div>
  </div>
</div></div>
</body></html>
