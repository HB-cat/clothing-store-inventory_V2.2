<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>新建订单 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav" style="position:relative">
    <span class="back" onclick="location.href='home.html'">‹</span>
    <span class="title">新建订单</span>
    <span class="action" onclick="alert('提交订单')">✓</span>
  </div>
  <div class="content">
    <div class="form-group"><label>客户</label><input class="form-input" placeholder="客户名称" value="李女士"></div>
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <button class="btn btn-sm btn-outline" onclick="alert('添加商品')">+ 添加商品</button>
      <button class="btn btn-sm btn-outline" style="border-color:var(--border);color:var(--text-secondary)">从草稿</button>
    </div>
    <div class="card" style="padding:0 16px">
      <div class="list-item">
        <div class="thumb">👕</div>
        <div class="info"><div class="name">纯棉圆领T恤 · 白色M</div><div class="desc">¥65 × 2</div></div>
        <div class="right"><div class="price">¥130</div><div class="sub" style="color:var(--danger);cursor:pointer" onclick="this.parentElement.parentElement.remove()">删除</div></div>
      </div>
      <div class="list-item">
        <div class="thumb">👗</div>
        <div class="info"><div class="name">碎花雪纺连衣裙 · 蓝色M</div><div class="desc">¥120 × 1</div></div>
        <div class="right"><div class="price">¥120</div><div class="sub" style="color:var(--danger);cursor:pointer" onclick="this.parentElement.parentElement.remove()">删除</div></div>
      </div>
    </div>
    <div style="text-align:right;padding:12px 0">
      <span style="color:var(--text-secondary);font-size:14px">合计 </span>
      <span style="font-size:28px;font-weight:800;color:var(--danger)">¥250</span>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline btn-block" onclick="alert('已保存草稿')">存草稿</button>
      <button class="btn btn-primary btn-block" onclick="alert('✅ 订单已提交')">提交</button>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="tab" onclick="location.href='home.html'"><span class="icon">🏠</span>首页</button>
    <button class="tab" onclick="location.href='bills.html'"><span class="icon">📋</span>账单</button>
    <button class="tab" onclick="location.href='products.html'"><span class="icon">🏷️</span>商品</button>
    <button class="tab" onclick="location.href='profile.html'"><span class="icon">👤</span>我的</button>
  </div>
  <button class="agent-fab" onclick="location.href='agent-panel.html'" title="智能体">AI</button>
</div></div>
</body></html>
