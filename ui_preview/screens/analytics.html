<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>经营分析 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav" style="position:relative">
    <span class="back" onclick="location.href='home.html'">‹</span>
    <span class="title">经营分析</span>
    <span class="action" onclick="alert('📊 查看报表')">📊</span>
  </div>
  <div class="content">
    <div class="segment" id="analyticsSeg">
      <button class="opt active" onclick="toggleSeg(this)">本周</button>
      <button class="opt" onclick="toggleSeg(this)">本月</button>
      <button class="opt" onclick="toggleSeg(this)">本年</button>
    </div>
    <div class="stats-row">
      <div class="item"><div class="value">¥3,420</div><div class="label">总销售额</div></div>
      <div class="item"><div class="value">¥980</div><div class="label">总毛利</div></div>
    </div>
    <div class="card">
      <div class="inline-toggle open" onclick="toggleInline(this)">
        <h3 style="font-size:14px;font-weight:700">📈 销售趋势</h3>
        <span class="arrow">▼</span>
      </div>
      <div class="inline-list open">
        <div class="chart-placeholder" style="height:120px;margin-top:8px">📈 折线图：最近7日销售额</div>
      </div>
    </div>
    <div class="card">
      <div class="inline-toggle open" onclick="toggleInline(this)">
        <h3 style="font-size:14px;font-weight:700">🏆 热销排行</h3>
        <span class="arrow">▼</span>
      </div>
      <div class="inline-list open">
        <div class="item"><span>1</span><span>纯棉圆领T恤</span><span style="margin-left:auto;color:var(--primary)">¥1,560</span></div>
        <div class="item"><span>2</span><span>高腰阔腿牛仔裤</span><span style="margin-left:auto;color:var(--primary)">¥1,170</span></div>
        <div class="item"><span>3</span><span>碎花雪纺连衣裙</span><span style="margin-left:auto;color:var(--primary)">¥960</span></div>
      </div>
    </div>
    <div class="card">
      <div class="inline-toggle" onclick="toggleInline(this)">
        <h3 style="font-size:14px;font-weight:700">📊 更多分析</h3>
        <span class="arrow">▼</span>
      </div>
      <div class="inline-list">
        <div class="chart-placeholder" style="height:80px">库存周转 / 客户分析 / 毛利趋势</div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="tab" onclick="location.href='home.html'"><span class="icon">🏠</span>首页</button>
    <button class="tab" onclick="location.href='bills.html'"><span class="icon">📋</span>账单</button>
    <button class="tab" onclick="location.href='products.html'"><span class="icon">🏷️</span>商品</button>
    <button class="tab" onclick="location.href='profile.html'"><span class="icon">👤</span>我的</button>
  </div>
  <button class="agent-fab" onclick="location.href='agent-panel.html'" title="智能体">AI</button>
</div></div>
<script>
  function toggleSeg(el) { el.parentElement.querySelectorAll('.opt').forEach(function(b){b.classList.remove('active')}); el.classList.add('active'); }
  function toggleInline(el) { el.classList.toggle('open'); el.nextElementSibling.classList.toggle('open'); }
</script>
</body></html>
