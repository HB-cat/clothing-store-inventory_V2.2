<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>买家首页 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="content">
    <div class="welcome-header">
      <div class="greeting">🛍️ 欢迎</div>
      <div class="shop-name">买家端 · 搜索关注零售商</div>
    </div>

    <div class="form-group" style="margin-bottom:16px">
      <input class="form-input" placeholder="🔍 搜索零售商名称...">
    </div>

    <div class="section-header"><h3>已关注商家</h3></div>
    <div class="card" style="padding:0 16px">
      <div class="list-item">
        <div class="thumb" style="background:#FFF3E0">🏪</div>
        <div class="info"><div class="name">欣欣服装店</div><div class="desc">32件商品在售</div></div>
        <div><button class="btn btn-sm btn-primary" onclick="location.href='buyer-products.html'">逛逛</button></div>
      </div>
      <div class="list-item">
        <div class="thumb" style="background:#E3F2FD">🏪</div>
        <div class="info"><div class="name">潮流前线</div><div class="desc">18件商品在售</div></div>
        <div><button class="btn btn-sm btn-primary" onclick="location.href='buyer-products.html'">逛逛</button></div>
      </div>
    </div>

    <div class="section-header" style="margin-top:8px"><h3>📋 我的预约</h3><span class="more">查看全部</span></div>
    <div class="card" style="padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:14px;font-weight:500">欣欣服装店 · 明天 14:00</div><div style="font-size:12px;color:var(--text-secondary)">状态: 待确认</div></div>
        <span class="badge badge-pending">待确认</span>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="tab active"><span class="icon">🏠</span>首页</button>
    <button class="tab" onclick="location.href='buyer-messages.html'"><span class="icon">💬</span>消息</button>
    <button class="tab" onclick="location.href='buyer-profile.html'"><span class="icon">👤</span>我的</button>
  </div>
</div></div>
</body></html>
