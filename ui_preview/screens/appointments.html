<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>预约管理 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav" style="position:relative">
    <span class="back" onclick="location.href='home.html'">‹</span>
    <span class="title">预约管理</span>
    <span class="action" onclick="alert('📅 新建预约')">+</span>
  </div>
  <div class="content">
    <div class="segment" id="aptSeg">
      <button class="opt active" onclick="toggleSeg(this)">待处理</button>
      <button class="opt" onclick="toggleSeg(this)">已接受</button>
      <button class="opt" onclick="toggleSeg(this)">已完成</button>
    </div>
    <div class="timeline-item">
      <div class="time">14:30</div>
      <div class="detail"><div class="name">李女士 · 看货</div><div class="info">预约看连衣裙 · 2人</div></div>
      <div class="actions"><button class="btn btn-sm btn-primary" onclick="alert('已接受')">接受</button><button class="btn btn-sm btn-outline" onclick="alert('已拒绝')" style="color:var(--danger);border-color:var(--danger)">拒绝</button></div>
    </div>
    <div class="timeline-item">
      <div class="time">16:00</div>
      <div class="detail"><div class="name">王先生 · 拿货</div><div class="info">T恤 20件 · 已预付</div></div>
      <div class="actions"><span class="badge badge-pending">待确认</span></div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="tab" onclick="location.href='home.html'"><span class="icon">🏠</span>首页</button>
    <button class="tab" onclick="location.href='bills.html'"><span class="icon">📋</span>账单</button>
    <button class="tab" onclick="location.href='products.html'"><span class="icon">🏷️</span>商品</button>
    <button class="tab" onclick="location.href='profile.html'"><span class="icon">👤</span>我的</button>
  </div>
  <button class="agent-fab" onclick="location.href='agent-panel.html'" title="智能体">AI</button>
</div></div>
<script>
  function toggleSeg(el) { el.parentElement.querySelectorAll('.opt').forEach(function(b){b.classList.remove('active')}); el.classList.add('active'); }
</script>
</body></html>
