<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>数据管理 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav">
    <button class="back" onclick="history.back()">←</button>
    <span class="title">数据管理</span>
  </div>
  <div class="content">
    <div class="card" style="text-align:center;padding:24px">
      <div style="font-size:40px;margin-bottom:8px">📤</div>
      <h3 style="font-size:16px;margin-bottom:4px">导出数据</h3>
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">导出商品、账单等所有数据到本地</p>
      <button class="btn btn-primary">开始导出</button>
    </div>
    <div class="card" style="text-align:center;padding:24px">
      <div style="font-size:40px;margin-bottom:8px">📥</div>
      <h3 style="font-size:16px;margin-bottom:4px">恢复数据</h3>
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">从备份文件恢复数据</p>
      <button class="btn btn-outline">选择备份文件</button>
    </div>
    <div class="card" style="text-align:center;padding:24px;border:1.5px solid var(--danger)">
      <div style="font-size:40px;margin-bottom:8px">⚠️</div>
      <h3 style="font-size:16px;margin-bottom:4px;color:var(--danger)">初始化数据</h3>
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">清除所有数据，恢复出厂状态，此操作不可撤销</p>
      <button class="btn btn-outline" style="border-color:var(--danger);color:var(--danger)">初始化</button>
    </div>
  </div>
</div></div>
</body></html>
