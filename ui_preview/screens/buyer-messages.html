<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>消息 - 买家端</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">

        <div class="right"><div style="font-size:11px;color:var(--text-secondary)">10:00</div></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="tab" onclick="location.href='buyer-home.html'"><span class="icon">🏠</span>首页</button>
    <button class="tab active" onclick="location.href='buyer-messages.html'"><span class="icon">💬</span>消息</button>
