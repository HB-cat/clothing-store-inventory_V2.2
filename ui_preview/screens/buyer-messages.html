<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>买家消息 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav" style="position:relative">
    <span class="back" onclick="location.href='buyer-home.html'">‹</span>
    <span class="title">消息</span>
    <span class="action" onclick="alert('新建')">✏️</span>
  </div>
  <div class="content">
    <div class="segment" id="buyerMsgSeg">
      <button class="opt active" onclick="toggleSeg(this)">聊天</button>
      <button class="opt" onclick="toggleSeg(this)">预约</button>
    </div>
    <div class="card" style="padding:0 16px">
      <div class="list-item" onclick="alert('聊天中...')">
        <div class="thumb">🏪</div>
        <div class="info"><div class="name">欣欣服装店</div><div class="desc">好的，下午可以过来看货</div></div>
        <div class="right"><span class="badge badge-done" style="background:var(--primary);color:#fff">2</span></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="tab" onclick="location.href='buyer-home.html'"><span class="icon">🛍️</span>逛逛</button>
    <button class="tab active" onclick="location.href='buyer-messages.html'"><span class="icon">💬</span>消息</button>
    <button class="tab" onclick="location.href='buyer-profile.html'"><span class="icon">👤</span>我的</button>
  </div>
</div></div>
<script>
  function toggleSeg(el) { el.parentElement.querySelectorAll('.opt').forEach(function(b){b.classList.remove('active')}); el.classList.add('active'); }
</script>
</body></html>
