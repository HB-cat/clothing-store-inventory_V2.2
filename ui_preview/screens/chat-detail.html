<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>聊天 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav">
    <button class="back" onclick="history.back()">←</button>
    <span class="title">李女士</span>
    <button class="action">📞</button>
  </div>
  <div class="content" style="display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:8px">
    <div class="chat-bubble">
      <div class="avatar">👩</div>
      <div class="bubble incoming">老板，碎花连衣裙有蓝色的吗？</div>
    </div>
    <div class="chat-bubble mine">
      <div class="avatar">👤</div>
      <div class="bubble outgoing">有的，蓝色S/M/L都有货，¥120</div>
    </div>
    <div class="chat-bubble">
      <div class="avatar">👩</div>
      <div class="bubble incoming">好的，我明天过来看看方便吗？</div>
    </div>
    <div class="chat-bubble mine">
      <div class="avatar">👤</div>
      <div class="bubble outgoing">可以的，上午10点开门，到了给我发消息</div>
    </div>
    <div class="chat-bubble">
      <div class="avatar">👩</div>
      <div class="bubble incoming">👌 好的</div>
    </div>
  </div>
  <div class="chat-input">
    <span style="cursor:default">📎</span>
    <input placeholder="输入消息...">
    <span style="cursor:default;font-size:20px">😊</span>
    <button>➤</button>
  </div>
</div></div>
</body></html>
