<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>我的关注 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>

      <div class="card" style="padding:8px">

        <div class="list-item">
          <div class="thumb" style="background:#E8F8F5">🏪</div>
          <div class="info"><div class="name">童装天地</div><div class="desc">28件商品在售 · 距您1.5km</div></div>

      </div>
    </div>

    <!-- 我的关注 -->
    <div class="section-header"><h3>❤️ 我的关注</h3></div>

      <div class="list-item">

        <button class="btn btn-sm btn-primary" style="border-radius:18px" onclick="location.href='buyer-products.html'">逛逛</button>
      </div>
      <div class="list-item">
        <div class="thumb" style="background:#E3F2FD">🏪</div>

      <div class="list-item">
        <div class="thumb" style="background:#F3E5F5">🏪</div>

        <button class="btn btn-sm btn-primary" style="border-radius:18px" onclick="location.href='buyer-products.html'">逛逛</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="tab" onclick="location.href='buyer-home.html'"><span class="icon">🏠</span>首页</button>
    <button class="tab active" onclick="location.href='buyer-follows.html'"><span class="icon">❤️</span>关注</button>
    <button class="tab" onclick="location.href='buyer-messages.html'"><span class="icon">💬</span>消息</button>
