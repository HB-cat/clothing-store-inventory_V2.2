<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>添加商品 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav">
    <button class="back" onclick="history.back()">←</button>
    <span class="title">添加商品</span>
    <button class="action">✔️</button>
  </div>
  <div class="content">
    <div class="form-group"><label>商品名称</label><input class="form-input" placeholder="如：纯棉圆领T恤"></div>
    <div class="form-group">
      <label>分类</label>
      <select class="form-input"><option>上装</option><option>下装</option><option selected>上衣</option><option>外套</option><option>配饰</option></select>
    </div>
    <div class="form-group" style="display:flex;gap:10px">
      <div style="flex:1"><label>售价</label><input class="form-input" placeholder="¥" value="65"></div>
      <div style="flex:1"><label>成本价</label><input class="form-input" placeholder="¥" value="35"></div>
    </div>

    <div class="section-header" style="margin-top:8px"><h3>🎨 属性组合库存</h3></div>
    <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">选择颜色和尺码组合，设置各组合库存</p>

    <div class="form-group"><label>颜色</label>
      <div class="attr-grid">
        <span class="attr-chip active">白色</span>
        <span class="attr-chip">黑色</span>
        <span class="attr-chip">蓝色</span>
        <span class="attr-chip">红色</span>
      </div>
    </div>
    <div class="form-group"><label>尺码</label>
      <div class="attr-grid">
        <span class="attr-chip active">S</span>
        <span class="attr-chip active">M</span>
        <span class="attr-chip">L</span>
        <span class="attr-chip">XL</span>
      </div>
    </div>

    <div class="card" style="padding:0 12px;font-size:13px">
      <table class="table">
        <tr><th>颜色</th><th>尺码</th><th>库存</th><th>售价</th></tr>
        <tr><td>白色</td><td>S</td><td>12</td><td>¥65</td></tr>
        <tr><td>白色</td><td>M</td><td>23</td><td>¥65</td></tr>
        <tr><td>黑色</td><td>S</td><td>8</td><td>¥65</td></tr>
        <tr><td>黑色</td><td>M</td><td>15</td><td>¥65</td></tr>
      </table>
    </div>
  </div>
  <button class="agent-fab" onclick="location.href='agent-panel.html'" title="智能体">🤖</button>
</div></div>
</body></html>
