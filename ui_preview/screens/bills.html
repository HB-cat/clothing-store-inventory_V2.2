<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>账单 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav" style="position:relative">
    <span class="back" onclick="location.href='home.html'">‹</span>
    <span class="title">账单</span>
    <span class="action" onclick="location.href='sale.html'">+</span>
  </div>
  <div class="content">
    <div class="segment" id="timeSegment">
      <button class="opt active" onclick="toggleSeg(this)">今日</button>
      <button class="opt" onclick="toggleSeg(this)">本月</button>
      <button class="opt" onclick="toggleSeg(this)">本年</button>
    </div>
    <div class="stats-row">
      <div class="item"><div class="value">¥2,380</div><div class="label">销售额</div></div>
      <div class="item"><div class="value">¥680</div><div class="label">毛利</div></div>
      <div class="item"><div class="value">18</div><div class="label">笔数</div></div>
    </div>
    <div class="card" style="padding:0 16px;border-left:4px solid var(--warning);border-radius:var(--R-lg);margin-bottom:10px">
      <div class="list-item">
        <div class="info"><div class="name">📄 草稿账单 #D001</div><div class="desc">3件商品 · ¥195</div></div>
        <div class="right"><span class="badge badge-pending">未提交</span></div>
      </div>
    </div>
    <div class="section-header"><h3>📋 销售流水</h3></div>
    <div class="card" style="padding:0 16px">
      <div class="list-item">
        <div class="thumb">👕</div>
        <div class="info"><div class="name">纯棉圆领T恤 · 白色M</div><div class="desc">散客 · 14:30 · 2件</div></div>
        <div class="right"><div class="price">¥130</div><div class="sub" style="color:var(--danger);cursor:pointer" onclick="if(confirm('确认退货？'))alert('已退货')">退货</div></div>
      </div>
      <div class="list-item">
        <div class="thumb">👗</div>
        <div class="info"><div class="name">碎花雪纺连衣裙 · 蓝色M</div><div class="desc">李女士 · 11:20 · 1件</div></div>
        <div class="right"><div class="price">¥120</div><div class="sub" style="color:var(--success)">已退</div></div>
      </div>
      <div class="list-item">
        <div class="thumb">👖</div>
        <div class="info"><div class="name">高腰阔腿牛仔裤 · 浅蓝27</div><div class="desc">王先生 · 09:45 · 3件</div></div>
        <div class="right"><div class="price">¥390</div><div class="sub" style="color:var(--success)">已提交</div></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="tab" onclick="location.href='home.html'"><span class="icon">🏠</span>首页</button>
    <button class="tab active" onclick="location.href='bills.html'"><span class="icon">📋</span>账单</button>
    <button class="tab" onclick="location.href='products.html'"><span class="icon">🏷️</span>商品</button>
    <button class="tab" onclick="location.href='profile.html'"><span class="icon">👤</span>我的</button>
  </div>
  <button class="agent-fab" onclick="location.href='agent-panel.html'" title="智能体">AI</button>
</div></div>
<script>
  function toggleSeg(el) {
    el.parentElement.querySelectorAll('.opt').forEach(function(b) { b.classList.remove('active'); });
    el.classList.add('active');
  }
</script>
</body></html>
