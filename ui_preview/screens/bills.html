<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>账单 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css">
<style>
  .time-query { display: flex; gap: 10px; margin-bottom: 14px; }
  .time-query .opt {
    flex: 1; padding: 10px; text-align: center;
    border-radius: var(--radius-sm);
    font-size: 13px; cursor: pointer;
    border: none; background: rgba(255,255,255,0.12);
    font-family: var(--font);
    color: rgba(255,255,255,0.65);
    transition: all 0.2s;
  }
  .time-query .opt.active {
    background: var(--surface);
    color: var(--primary);
    font-weight: 600;
    box-shadow: var(--shadow);
  }
  .time-query .opt:not(.active):hover {
    background: rgba(255,255,255,0.2);
  }
</style></head>
<body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav" style="position:relative">
    <span class="title" style="position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap">账单</span>
    <div style="width:36px;flex-shrink:0"></div>
    <div style="flex:1"></div>
    <button class="action" onclick="location.href='sale.html'">➕</button>
  </div>
  <div class="content">
    <!-- 可点击时间选择：支持互斥选中，再次点击取消选中 -->
    <div class="time-query">
      <button class="opt" onclick="toggleTime(this)">今日</button>
      <button class="opt" onclick="toggleTime(this)">本月</button>
      <button class="opt" onclick="toggleTime(this)">本年</button>
    </div>

    <!-- 统计卡片（查询后才显示）PRD 4.6 -->
    <div class="stats-row">
      <div class="item"><div class="value">¥2,380</div><div class="label">销售额</div></div>
      <div class="item"><div class="value">¥680</div><div class="label">毛利</div></div>
      <div class="item"><div class="value">18</div><div class="label">笔数</div></div>
    </div>

    <!-- 草稿 -->
    <div class="card" style="padding:0 16px;border-left:3px solid var(--warning);margin-bottom:10px">
      <div class="list-item">
        <div class="info"><div class="name">📄 草稿账单 #D001</div><div class="desc">3件商品 · ¥195</div></div>
        <div class="right"><span class="badge badge-pending">未提交</span></div>
      </div>
    </div>

    <!-- 已完成流水 -->
    <div class="section-header"><h3>📋 销售流水</h3></div>

    <div class="card" style="padding:0 16px">
      <div class="list-item">
        <div class="thumb">👕</div>
        <div class="info">
          <div class="name">纯棉圆领T恤 · 白色M</div>
          <div class="desc">散客 · 14:30 · 2件</div>
        </div>
        <div class="right">
          <div class="price">¥130</div>
          <div class="sub" style="color:var(--danger);cursor:pointer" onclick="if(confirm('确认退货？'))alert('已退货')">退货</div>
        </div>
      </div>
      <div class="list-item">
        <div class="thumb">👗</div>
        <div class="info">
          <div class="name">碎花雪纺连衣裙 · 蓝色M</div>
          <div class="desc">李女士 · 11:20 · 1件</div>
        </div>
        <div class="right">
          <div class="price">¥120</div>
          <div class="sub" style="color:var(--success)">已退</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="tab" onclick="location.href='home.html'"><span class="icon">🏠</span>首页</button>
    <button class="tab active" onclick="location.href='bills.html'"><span class="icon">📋</span>账单</button>
    <button class="tab" onclick="location.href='chat-list.html'"><span class="icon">💬</span>消息</button>
    <button class="tab" onclick="location.href='profile.html'"><span class="icon">👤</span>我的</button>
  </div>
  <button class="agent-fab" onclick="location.href='agent-panel.html'" title="智能体">🤖</button>
</div></div>
<script>
  // 互斥选中 + 再次点击取消选中
  function toggleTime(el) {
    var parent = el.parentElement;
    var all = parent.querySelectorAll('.opt');
    if (el.classList.contains('active')) {
      el.classList.remove('active');
    } else {
      all.forEach(function(b) { b.classList.remove('active'); });
      el.classList.add('active');
    }
  }
</script>
</body></html>
