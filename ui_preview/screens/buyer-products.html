<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>商品浏览 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav" style="position:relative">
    <span class="back" onclick="location.href='buyer-home.html'">‹</span>
    <span class="title">欣欣服装店 · 商品</span>
    <span class="action" onclick="alert('筛选')">🔍</span>
  </div>
  <div class="content">
    <div class="segment" id="buyerSeg">
      <button class="opt active" onclick="toggleSeg(this)">全部</button>
      <button class="opt" onclick="toggleSeg(this)">上装</button>
      <button class="opt" onclick="toggleSeg(this)">裤装</button>
    </div>
    <div class="recommend-grid" style="grid-template-columns:repeat(2,1fr)">
      <div class="recommend-card" onclick="alert('👕 纯棉圆领T恤 · 售价¥69')"><div class="emoji">👕</div><div class="name">纯棉圆领T恤</div><div class="meta">白色M</div><div style="font-size:16px;font-weight:700;color:var(--danger);margin-top:4px">¥69</div></div>
      <div class="recommend-card" onclick="alert('👗 碎花雪纺连衣裙 · 售价¥129')"><div class="emoji">👗</div><div class="name">碎花雪纺连衣裙</div><div class="meta">蓝色M</div><div style="font-size:16px;font-weight:700;color:var(--danger);margin-top:4px">¥129</div></div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="alert('📅 预约看货');location.href='buyer-messages.html'">预约看货</button>
  </div>
  <div class="bottom-nav">
    <button class="tab" onclick="location.href='buyer-home.html'"><span class="icon">🛍️</span>逛逛</button>
    <button class="tab" onclick="location.href='buyer-messages.html'"><span class="icon">💬</span>消息</button>
    <button class="tab" onclick="location.href='buyer-profile.html'"><span class="icon">👤</span>我的</button>
  </div>
</div></div>
<script>
  function toggleSeg(el) { el.parentElement.querySelectorAll('.opt').forEach(function(b){b.classList.remove('active')}); el.classList.add('active'); }
</script>
</body></html>
