<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>进货入库 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>

  <div class="content">

  </div>
  <button class="agent-fab" onclick="location.href='agent-panel.html'" title="智能体">🤖</button>
</div></div>
