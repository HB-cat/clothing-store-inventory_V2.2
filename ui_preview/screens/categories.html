<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>分类管理 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav">
    <button class="back" onclick="history.back()">←</button>
    <span class="title">分类管理</span>
    <button class="action">➕</button>
  </div>
  <div class="content">
    <div class="form-group" style="margin-bottom:12px"><input class="form-input" placeholder="🔍 搜索分类..."></div>
    <div class="card" style="padding:0 16px">
      <div class="list-item" style="cursor:default"><span style="font-size:20px">👕</span><span style="flex:1">上装</span><span style="color:var(--text-secondary);font-size:12px">12件商品</span><span style="cursor:pointer;color:var(--danger);margin-left:8px">✕</span></div>
      <div class="list-item" style="cursor:default"><span style="font-size:20px">👗</span><span style="flex:1">连衣裙</span><span style="color:var(--text-secondary);font-size:12px">8件商品</span><span style="cursor:pointer;color:var(--danger);margin-left:8px">✕</span></div>
      <div class="list-item" style="cursor:default"><span style="font-size:20px">👖</span><span style="flex:1">下装</span><span style="color:var(--text-secondary);font-size:12px">6件商品</span><span style="cursor:pointer;color:var(--danger);margin-left:8px">✕</span></div>
      <div class="list-item" style="cursor:default"><span style="font-size:20px">🧥</span><span style="flex:1">外套</span><span style="color:var(--text-secondary);font-size:12px">4件商品</span><span style="cursor:pointer;color:var(--danger);margin-left:8px">✕</span></div>
    </div>
    <p style="font-size:11px;color:var(--text-light);text-align:center;margin-top:8px">🔄 长按拖拽可排序</p>
  </div>
</div></div>
</body></html>
