<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>消息 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav" style="position:relative">
    <span class="back" onclick="location.href='home.html'">‹</span>
    <span class="title">消息</span>
    <span class="action" onclick="alert('搜索')">🔍</span>
  </div>
  <div class="content">
    <div class="segment" id="msgSeg">
      <button class="opt active" onclick="toggleSeg(this)">聊天</button>
      <button class="opt" onclick="toggleSeg(this)">预约</button>
    </div>
    <div class="card" style="padding:0 16px;cursor:pointer" onclick="location.href='chat-detail.html'">
      <div class="list-item">
        <div class="thumb">👤</div>
        <div class="info"><div class="name">李女士</div><div class="desc">好的，那我下午过来看货</div></div>
        <div class="right"><span class="badge badge-done" style="background:var(--primary);color:#fff">3</span></div>
      </div>
      <div class="list-item" onclick="event.stopPropagation();location.href='chat-detail.html'">
        <div class="thumb">👤</div>
        <div class="info"><div class="name">王先生</div><div class="desc">T恤还有白色M码吗？</div></div>
        <div class="right"><span class="badge badge-done" style="background:var(--primary);color:#fff">1</span></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="tab" onclick="location.href='home.html'"><span class="icon">🏠</span>首页</button>
    <button class="tab" onclick="location.href='bills.html'"><span class="icon">📋</span>账单</button>
    <button class="tab" onclick="location.href='products.html'"><span class="icon">🏷️</span>商品</button>
    <button class="tab" onclick="location.href='profile.html'"><span class="icon">👤</span>我的</button>
  </div>
  <button class="agent-fab" onclick="location.href='agent-panel.html'" title="智能体">AI</button>
</div></div>
<script>
  function toggleSeg(el) { el.parentElement.querySelectorAll('.opt').forEach(function(b){b.classList.remove('active')}); el.classList.add('active'); }
</script>
</body></html>
