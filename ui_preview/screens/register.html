<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>注册 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="top-nav">
    <button class="back" onclick="history.back()">←</button>
    <span class="title">注册账号</span>
  </div>
  <div class="content">
    <p class="page-subtitle">选择你的角色</p>
    <div class="role-selector">
      <div class="role-card active" onclick="document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('active')); this.classList.add('active')">
        <div class="icon">🏪</div><div class="name">零售商</div>
      </div>
      <div class="role-card" onclick="document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('active')); this.classList.add('active')">
        <div class="icon">🏭</div><div class="name">批发商</div>
      </div>
      <div class="role-card" onclick="document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('active')); this.classList.add('active')">
        <div class="icon">🛍️</div><div class="name">买家</div>
      </div>
    </div>
    <div class="form-group"><label>用户名</label><input class="form-input" placeholder="请输入用户名"></div>
    <div class="form-group"><label>密码</label><input class="form-input" type="password" placeholder="至少6位"></div>
    <div class="form-group"><label>确认密码</label><input class="form-input" type="password" placeholder="再次输入密码"></div>
    <div class="form-group"><label>店铺名称</label><input class="form-input" placeholder="（选填）"></div>
    <button class="btn btn-primary btn-block btn-lg" style="margin-top:8px" onclick="location.href='home.html'">注 册</button>
    <p style="text-align:center; margin-top:12px; font-size:13px; color:var(--text-secondary)">
      已有账号？<a href="login.html" style="color:var(--primary);text-decoration:none;font-weight:500">去登录</a>
    </p>
  </div>
</div></div>
</body></html>
