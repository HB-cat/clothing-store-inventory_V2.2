<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>注册 - Clothing-SI</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="phone-wrapper"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="content" style="padding:0 24px">
    <div class="login-logo" style="padding:24px 0">
      <h1 style="font-size:24px">注册账号</h1>
      <p>选择角色，开始使用</p>
    </div>
    <div class="role-selector">
      <div class="role-card active" onclick="selectRole(this)"><div class="icon">🏪</div><div class="name">零售商</div></div>
      <div class="role-card" onclick="selectRole(this)"><div class="icon">🏭</div><div class="name">批发商</div></div>
      <div class="role-card" onclick="selectRole(this)"><div class="icon">🛍️</div><div class="name">买家</div></div>
    </div>
    <div class="form-group"><label>店铺名称</label><input class="form-input" placeholder="输入店铺名称"></div>
    <div class="form-group"><label>用户名</label><input class="form-input" placeholder="设置用户名"></div>
    <div class="form-group"><label>密码</label><input class="form-input" type="password" placeholder="设置密码"></div>
    <button class="btn btn-primary btn-block btn-lg" onclick="alert('✅ 注册成功！');location.href='login.html'">注册</button>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-secondary)">已有账号？<a href="login.html" style="color:var(--primary);text-decoration:none;font-weight:600">立即登录</a></p>
  </div>
</div></div>
<script>
  function selectRole(el) { document.querySelectorAll('.role-card').forEach(function(c){c.classList.remove('active')}); el.classList.add('active'); }
</script>
</body></html>
